<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CoinFlip Casino</title>

    <!-- Favicon -->
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

    <!-- ============================================================
         AUTH CONTAINER
         ============================================================ -->
    <div class="auth-container">

        <!-- Background Glow -->
        <div class="bg-glow"></div>

        <!-- Back Button -->
        <a href="/" class="back-btn">← Back to Home</a>

        <!-- Auth Card -->
        <div class="auth-card">

            <!-- Brand -->
            <div class="auth-brand">
                <div class="brand-icon">🪙</div>
                <div class="brand-name">
                    <span class="brand-text">CoinFlip</span>
                    <span class="brand-badge">CASINO</span>
                </div>
            </div>

            <!-- Tab Switcher -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">🔓 Login</button>
                <button class="auth-tab" data-tab="signup">📝 Sign Up</button>
            </div>

            <!-- ============================================================
                 LOGIN FORM
                 ============================================================ -->
            <div class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" class="auth-input" placeholder="Enter your username" minlength="3" maxlength="20" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" class="auth-input" placeholder="Enter your password" minlength="4" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <button type="submit" class="auth-submit login-submit" id="loginBtn">🔓 Login</button>
                <div class="auth-divider">or</div>
                <div class="social-login">
                    <button class="social-btn">🎮 Continue with Discord</button>
                </div>
                <div id="loginError" class="auth-error" style="display: none;"></div>
            </div>

            <!-- ============================================================
                 SIGNUP FORM
                 ============================================================ -->
            <div class="auth-form" id="signupForm" style="display: none;">
                <div class="form-group">
                    <label for="signupUsername">Choose Username</label>
                    <input type="text" id="signupUsername" class="auth-input" placeholder="Choose a unique username" minlength="3" maxlength="20" autocomplete="username" required>
                    <span class="form-hint">3-20 characters, letters/numbers/underscores only</span>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Create Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="signupPassword" class="auth-input" placeholder="Create a strong password" minlength="4" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                    <span class="form-hint">Minimum 4 characters</span>
                </div>
                <div class="form-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="signupConfirmPassword" class="auth-input" placeholder="Confirm your password" minlength="4" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>
                <div class="form-terms">
                    <label class="terms-checkbox">
                        <input type="checkbox" id="termsCheck" required>
                        <span>I agree to the <a href="#" class="terms-link">Terms & Conditions</a> and <a href="#" class="terms-link">Privacy Policy</a></span>
                    </label>
                </div>
                <button type="submit" class="auth-submit signup-submit" id="signupBtn">📝 Create Account</button>
                <div class="auth-divider">or</div>
                <div class="social-login">
                    <button class="social-btn">🎮 Sign up with Discord</button>
                </div>
                <div id="signupError" class="auth-error" style="display: none;"></div>
            </div>

            <!-- Bonus Info -->
            <div class="auth-bonus">
                🎁 <strong>Welcome Bonus:</strong> New players get <span class="bonus-amount">$10</span> free on first deposit!
            </div>
        </div>

        <!-- Footer Note -->
        <div class="auth-footer">
            <p>🔒 Secure &bull; 🚀 Instant &bull; 💎 Trusted</p>
            <p class="auth-disclaimer">18+ only. Please gamble responsibly.</p>
        </div>
    </div>

    <!-- ============================================================
         JAVASCRIPT
         ============================================================ -->
    <script src="/js/login.js"></script>
</body>
</html>
