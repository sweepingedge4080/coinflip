<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Admin Dashboard | Coin Flip Casino</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            font-family: 'Courier New', 'Segoe UI', monospace;
            color: #e2e8f0;
            padding: 20px;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #1e2a3a;
            border-radius: 48px;
            border: 1px solid #facc15;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #facc15, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .admin-badge {
            background: #a855f7;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
        }

        .logout-btn {
            background: #ef4444;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-family: monospace;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1e2a3a;
            border-radius: 28px;
            padding: 20px;
            text-align: center;
            border-left: 4px solid #facc15;
        }

        .stat-value {
            font-size: 2rem;
            color: #facc15;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #0f1724;
            border: none;
            color: #94a3b8;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-family: monospace;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #facc15;
            color: #0f1724;
            font-weight: bold;
        }

        /* Requests Table */
        .requests-table {
            background: #0f1724;
            border-radius: 28px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            color: #facc15;
            font-weight: bold;
        }

        .status-pending {
            background: #facc15;
            color: #0f1724;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
        }

        .status-confirmed, .status-completed {
            background: #22c55e;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
        }

        .status-rejected {
            background: #ef4444;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
        }

        .approve-btn {
            background: #22c55e;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            margin-right: 5px;
        }

        .reject-btn {
            background: #ef4444;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Users Table */
        .users-table {
            background: #0f1724;
            border-radius: 28px;
            padding: 20px;
            overflow-x: auto;
            margin-top: 20px;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1e293b;
            border-left: 4px solid #facc15;
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            z-index: 10000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .refresh-btn {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            margin-left: 10px;
        }

        /* Action buttons container */
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="admin-header">
        <div class="logo">🪙 COIN FLIP CASINO | ADMIN DASHBOARD</div>
        <div>
            <span class="admin-badge" id="adminUser">ADMIN</span>
            <button class="logout-btn" id="logoutBtn">🚪 LOGOUT</button>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="totalUsers">0</div>
            <div class="stat-label">Total Users</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalVolume">0</div>
            <div class="stat-label">Total Wagered</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="pendingDeposits">0</div>
            <div class="stat-label">Pending Deposits</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="pendingWithdrawals">0</div>
            <div class="stat-label">Pending Withdrawals</div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="deposits">💵 Pending Deposits</button>
        <button class="tab-btn" data-tab="withdrawals">💰 Pending Withdrawals</button>
        <button class="tab-btn" data-tab="users">👥 All Users</button>
        <button class="tab-btn" data-tab="history">📜 Request History</button>
        <button class="tab-btn" id="refreshBtn">🔄 Refresh</button>
    </div>

    <!-- Deposits Table -->
    <div id="depositsTab" class="requests-table">
        <h3 style="margin-bottom: 15px; color: #facc15;">💵 Pending Deposit Requests</h3>
        <div id="depositsList">Loading...</div>
    </div>

    <!-- Withdrawals Table -->
    <div id="withdrawalsTab" class="requests-table" style="display: none;">
        <h3 style="margin-bottom: 15px; color: #facc15;">💰 Pending Withdrawal Requests</h3>
        <div id="withdrawalsList">Loading...</div>
    </div>

    <!-- Users Table -->
    <div id="usersTab" class="users-table" style="display: none;">
        <h3 style="margin-bottom: 15px; color: #facc15;">👥 All Users</h3>
        <div id="usersList">Loading...</div>
    </div>

    <!-- History Table -->
    <div id="historyTab" class="requests-table" style="display: none;">
        <h3 style="margin-bottom: 15px; color: #facc15;">📜 Processed Requests History</h3>
        <div id="historyList">Loading...</div>
    </div>
</div>

<script>
    const API_URL = ''; // Same domain
    let authToken = null;
    let currentUser = null;

    // Check if user is logged in and is admin
    async function checkAuth() {
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = '/';
            return;
        }
        authToken = token;
        
        try {
            const response = await fetch(`${API_URL}/api/auth/me`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            const user = await response.json();
            if (!user.isAdmin) {
                localStorage.removeItem('adminToken');
                window.location.href = '/';
                return;
            }
            currentUser = user;
            document.getElementById('adminUser').innerText = user.username.toUpperCase();
            loadDashboard();
        } catch (error) {
            localStorage.removeItem('adminToken');
            window.location.href = '/';
        }
    }

    async function apiCall(endpoint, method = 'GET', data = null) {
        const options = {
            method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authToken}`
            }
        };
        if (data) options.body = JSON.stringify(data);
        
        const response = await fetch(`${API_URL}/api${endpoint}`, options);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        return result;
    }

    async function loadDashboard() {
        await Promise.all([
            loadDeposits(),
            loadWithdrawals(),
            loadUsers(),
            loadStats()
        ]);
    }

    async function loadStats() {
        try {
            const users = await apiCall('/admin/users');
            const deposits = await apiCall('/admin/pending-deposits');
            const withdrawals = await apiCall('/admin/pending-withdrawals');
            
            document.getElementById('totalUsers').innerText = users.length;
            document.getElementById('pendingDeposits').innerText = deposits.length;
            document.getElementById('pendingWithdrawals').innerText = withdrawals.length;
            
            // Calculate total volume (sum of all user totalWagered)
            let totalVolume = users.reduce((sum, user) => sum + (user.totalWagered || 0), 0);
            document.getElementById('totalVolume').innerText = totalVolume.toFixed(0);
        } catch (error) {
            console.error('Failed to load stats:', error);
        }
    }

    async function loadDeposits() {
        try {
            const deposits = await apiCall('/admin/pending-deposits');
            const container = document.getElementById('depositsList');
            
            if (deposits.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;">✅ No pending deposits</div>';
                return;
            }
            
            let html = '<table><thead><tr>';
            html += '<th>Date</th><th>User</th><th>Amount</th><th>Crypto</th><th>TXID</th><th>Actions</th>';
            html += '</tr></thead><tbody>';
            
            for (const deposit of deposits) {
                html += '<tr>';
                html += `<td>${new Date(deposit.createdAt).toLocaleString()}</td>`;
                html += `<td>${deposit.username}</td>`;
                html += `<td>${deposit.amountPoints} points</td>`;
                html += `<td>${deposit.cryptoMethod}</td>`;
                html += `<td style="font-size:0.7rem;max-width:200px;word-break:break-all;">${deposit.transactionId}</td>`;
                html += `<td class="action-buttons">
                            <button class="approve-btn" onclick="approveDeposit('${deposit._id}')">✅ Approve</button>
                            <button class="reject-btn" onclick="rejectDeposit('${deposit._id}')">❌ Reject</button>
                        </td>`;
                html += '</tr>';
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (error) {
            document.getElementById('depositsList').innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">❌ Failed to load deposits</div>';
        }
    }

    async function loadWithdrawals() {
        try {
            const withdrawals = await apiCall('/admin/pending-withdrawals');
            const container = document.getElementById('withdrawalsList');
            
            if (withdrawals.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;">✅ No pending withdrawals</div>';
                return;
            }
            
            let html = '<table><thead><tr>';
            html += '<th>Date</th><th>User</th><th>Amount</th><th>Crypto</th><th>Wallet Address</th><th>Actions</th>';
            html += '</tr></thead><tbody>';
            
            for (const withdrawal of withdrawals) {
                html += '<tr>';
                html += `<td>${new Date(withdrawal.createdAt).toLocaleString()}</td>`;
                html += `<td>${withdrawal.username}</td>`;
                html += `<td>${withdrawal.amountPoints} points</td>`;
                html += `<td>${withdrawal.cryptoMethod}</td>`;
                html += `<td style="font-size:0.7rem;max-width:200px;word-break:break-all;">${withdrawal.walletAddress}</td>`;
                html += `<td class="action-buttons">
                            <button class="approve-btn" onclick="approveWithdrawal('${withdrawal._id}')">✅ Approve</button>
                            <button class="reject-btn" onclick="rejectWithdrawal('${withdrawal._id}')">❌ Reject</button>
                        </td>`;
                html += '</tr>';
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (error) {
            document.getElementById('withdrawalsList').innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">❌ Failed to load withdrawals</div>';
        }
    }

    async function loadUsers() {
        try {
            const users = await apiCall('/admin/users');
            const container = document.getElementById('usersList');
            
            let html = '<table><thead><tr>';
            html += '<th>Username</th><th>Balance</th><th>Wins/Losses</th><th>Win Rate</th><th>Total Wagered</th><th>Joined</th>';
            html += '</tr></thead><tbody>';
            
            for (const user of users) {
                const total = user.wins + user.losses;
                const winRate = total > 0 ? ((user.wins / total) * 100).toFixed(1) : 0;
                html += '<tr>';
                html += `<td>${user.username} ${user.isAdmin ? '👑' : ''}</td>`;
                html += `<td style="color:#facc15;">${user.balance.toFixed(2)}</td>`;
                html += `<td>${user.wins} / ${user.losses}</td>`;
                html += `<td>${winRate}%</td>`;
                html += `<td>${(user.totalWagered || 0).toFixed(2)}</td>`;
                html += `<td>${new Date(user.createdAt).toLocaleDateString()}</td>`;
                html += '</tr>';
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (error) {
            document.getElementById('usersList').innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">❌ Failed to load users</div>';
        }
    }

    async function approveDeposit(requestId) {
        if (!confirm('Approve this deposit? Funds will be added to user balance.')) return;
        try {
            await apiCall('/admin/approve-deposit', 'POST', { requestId });
            showNotification('✅ Deposit approved! Funds added.');
            loadDeposits();
            loadStats();
            loadUsers();
        } catch (error) {
            showNotification('❌ Error: ' + error.message);
        }
    }

    async function rejectDeposit(requestId) {
        const reason = prompt('Reason for rejection (optional):');
        try {
            await apiCall('/admin/reject-deposit', 'POST', { requestId, reason });
            showNotification('❌ Deposit rejected.');
            loadDeposits();
            loadStats();
        } catch (error) {
            showNotification('❌ Error: ' + error.message);
        }
    }

    async function approveWithdrawal(requestId) {
        if (!confirm('Approve this withdrawal? Points will be deducted from user balance.')) return;
        try {
            await apiCall('/admin/approve-withdrawal', 'POST', { requestId });
            showNotification('✅ Withdrawal approved! Send funds to user.');
            loadWithdrawals();
            loadStats();
            loadUsers();
        } catch (error) {
            showNotification('❌ Error: ' + error.message);
        }
    }

    async function rejectWithdrawal(requestId) {
        const reason = prompt('Reason for rejection (optional):');
        try {
            await apiCall('/admin/reject-withdrawal', 'POST', { requestId, reason });
            showNotification('❌ Withdrawal rejected.');
            loadWithdrawals();
            loadStats();
        } catch (error) {
            showNotification('❌ Error: ' + error.message);
        }
    }

    function showNotification(msg) {
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.innerHTML = msg;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3000);
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.id === 'refreshBtn') {
                loadDashboard();
                showNotification('🔄 Dashboard refreshed');
                return;
            }
            
            const tab = btn.dataset.tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            document.getElementById('depositsTab').style.display = tab === 'deposits' ? 'block' : 'none';
            document.getElementById('withdrawalsTab').style.display = tab === 'withdrawals' ? 'block' : 'none';
            document.getElementById('usersTab').style.display = tab === 'users' ? 'block' : 'none';
            document.getElementById('historyTab').style.display = tab === 'history' ? 'block' : 'none';
        });
    });

    document.getElementById('logoutBtn').onclick = () => {
        localStorage.removeItem('adminToken');
        window.location.href = '/';
    };

    // Get token from URL or localStorage
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    if (token) {
        localStorage.setItem('adminToken', token);
    }
    
    checkAuth();
</script>
</body>
</html>
