<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoinFlip Casino</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0e17;
            color: #fffffe;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            background: #1a1a2e;
            padding: 30px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            width: 480px;
            max-width: 95%;
            text-align: center;
            border: 1px solid #2a2a4a;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffd700, #ff6b00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #a7a9be;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #2a2a4a;
            padding-bottom: 14px;
        }

        /* ===== BALANCE ===== */
        .balance-container {
            background: #0f0e17;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 18px;
            border: 1px solid #2a2a4a;
        }

        .balance-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a7a9be;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: 700;
            color: #ffd700;
        }

        /* ===== LEVEL PROGRESSION UI ===== */
        .level-container {
            background: rgba(255, 215, 0, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 18px;
            backdrop-filter: blur(4px);
            transition: border-color 0.3s;
        }

        .level-container:hover {
            border-color: #ffd700;
        }

        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .level-badge {
            background: linear-gradient(135deg, #ffd700, #ff6b00);
            padding: 2px 16px;
            border-radius: 30px;
            font-weight: 700;
            color: #0f0e17;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .level-xp {
            color: #c0c0d0;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .level-xp span {
            color: #fffffe;
            font-weight: 600;
        }

        .xp-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            margin: 6px 0 4px 0;
        }

        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff6b00);
            width: 0%;
            transition: width 0.6s ease;
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        }

        .level-bonus {
            color: #a7a9be;
            font-size: 0.8rem;
            margin-top: 6px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .level-bonus span {
            color: #fffffe;
            font-weight: 600;
        }

        .level-bonus .highlight {
            color: #ffd700;
        }

        /* ===== BET SECTION ===== */
        .bet-section {
            background: #0f0e17;
            padding: 16px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #2a2a4a;
        }

        .bet-label {
            display: block;
            font-size: 0.8rem;
            color: #a7a9be;
            margin-bottom: 4px;
            text-align: left;
        }

        .bet-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bet-input-row input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            background: #1a1a2e;
            color: #fffffe;
            font-size: 1.1rem;
            font-weight: 600;
            outline: none;
            transition: border 0.2s;
        }

        .bet-input-row input:focus {
            border-color: #ffd700;
        }

        .bet-input-row input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bet-input-row button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s;
            background: #ffd700;
            color: #0f0e17;
        }

        .bet-input-row button:hover:not(:disabled) {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .bet-input-row button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .bet-presets {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: center;
        }

        .bet-presets button {
            background: #2a2a4a;
            border: none;
            color: #fffffe;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.15s;
        }

        .bet-presets button:hover {
            background: #3a3a5a;
        }

        .max-bet-warning {
            color: #ff6b6b;
            font-size: 0.75rem;
            margin-top: 4px;
            display: none;
            text-align: left;
        }

        .max-bet-warning.visible {
            display: block;
        }

        /* ===== COIN DISPLAY ===== */
        .coin-container {
            margin: 16px 0 20px 0;
        }

        .coin {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f5e56b, #b8860b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            font-weight: 700;
            color: #0f0e17;
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.2);
            transition: transform 0.4s ease, box-shadow 0.4s;
            user-select: none;
            border: 2px solid #daa520;
        }

        .coin.flipping {
            animation: flipCoin 0.8s ease;
        }

        @keyframes flipCoin {
            0%   { transform: rotateY(0) scale(1); }
            25%  { transform: rotateY(180deg) scale(1.1); }
            50%  { transform: rotateY(360deg) scale(1); }
            75%  { transform: rotateY(540deg) scale(1.05); }
            100% { transform: rotateY(720deg) scale(1); }
        }

        .coin-result {
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            min-height: 2rem;
        }

        .coin-result.win {
            color: #4ade80;
        }
        .coin-result.lose {
            color: #f87171;
        }

        /* ===== STATS ROW ===== */
        .stats-row {
            display: flex;
            justify-content: space-around;
            background: #0f0e17;
            border-radius: 12px;
            padding: 12px 8px;
            margin-top: 14px;
            border: 1px solid #2a2a4a;
            font-size: 0.8rem;
        }

        .stats-row .stat-item {
            text-align: center;
        }

        .stats-row .stat-value {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fffffe;
        }

        .stats-row .stat-label {
            color: #a7a9be;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value.green { color: #4ade80; }
        .stat-value.red   { color: #f87171; }
        .stat-value.gold  { color: #ffd700; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .container {
                padding: 18px 16px;
            }
            h1 { font-size: 1.6rem; }
            .balance-amount { font-size: 1.5rem; }
            .coin { width: 80px; height: 80px; font-size: 2rem; }
            .level-bonus { gap: 10px; font-size: 0.7rem; }
        }

        /* ===== LEVEL UP NOTIFICATION (overlay) ===== */
        .level-up-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeInOverlay 0.4s ease;
        }

        .level-up-overlay .card {
            background: linear-gradient(145deg, #1a1a2e, #2a2a4a);
            border: 2px solid #ffd700;
            border-radius: 30px;
            padding: 40px 50px;
            text-align: center;
            max-width: 420px;
            box-shadow: 0 30px 80px rgba(255, 215, 0, 0.2);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .level-up-overlay .card .emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 8px;
        }

        .level-up-overlay .card h2 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #ffd700, #ff6b00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .level-up-overlay .card p {
            color: #c0c0d0;
            font-size: 1rem;
            margin: 6px 0;
        }

        .level-up-overlay .card .new-max {
            color: #ffd700;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .level-up-overlay .card button {
            margin-top: 18px;
            padding: 10px 36px;
            border: none;
            border-radius: 30px;
            background: #ffd700;
            color: #0f0e17;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .level-up-overlay .card button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        @keyframes popIn {
            0%   { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeInOverlay {
            0%   { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🪙 CoinFlip</h1>
    <div class="subtitle">⬆️ Level up &amp; earn bigger rewards</div>

    <!-- BALANCE -->
    <div class="balance-container">
        <div class="balance-label">Your Balance</div>
        <div class="balance-amount" id="balanceDisplay">$0.00</div>
    </div>

    <!-- LEVEL PROGRESSION (NEW) -->
    <div class="level-container" id="levelContainer">
        <div class="level-header">
            <span class="level-badge">Level <span id="playerLevel">1</span></span>
            <span class="level-xp">XP: <span id="playerXP">0</span> / <span id="xpToNext">100</span></span>
        </div>
        <div class="xp-bar-container">
            <div class="xp-bar-fill" id="xpBarFill" style="width: 0%;"></div>
        </div>
        <div class="level-bonus">
            <span>🎯 Max Bet: $<span id="maxBetLimit">10</span></span>
            <span>💰 Win Bonus: <span id="winBonus">1.0</span>x</span>
            <span>🏆 Wins: <span id="totalWins" class="highlight">0</span></span>
        </div>
    </div>

    <!-- BET SECTION -->
    <div class="bet-section">
        <label class="bet-label" for="betInput">Place your bet</label>
        <div class="bet-input-row">
            <input type="number" id="betInput" min="0.01" step="0.5" value="1.00" />
            <button id="flipBtn">🔄 Flip</button>
        </div>
        <div class="bet-presets">
            <button data-amount="1">$1</button>
            <button data-amount="5">$5</button>
            <button data-amount="10">$10</button>
            <button data-amount="25">$25</button>
            <button data-amount="50">$50</button>
        </div>
        <div class="max-bet-warning" id="maxBetWarning">⚠️ Exceeds max bet for your level</div>
    </div>

    <!-- COIN -->
    <div class="coin-container">
        <div class="coin" id="coin">?</div>
        <div class="coin-result" id="resultText">Place a bet to start</div>
    </div>

    <!-- STATS -->
    <div class="stats-row">
        <div class="stat-item">
            <div class="stat-value green" id="winCount">0</div>
            <div class="stat-label">Wins</div>
        </div>
        <div class="stat-item">
            <div class="stat-value red" id="lossCount">0</div>
            <div class="stat-label">Losses</div>
        </div>
        <div class="stat-item">
            <div class="stat-value gold" id="streakCount">0</div>
            <div class="stat-label">Streak</div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  LEVEL PROGRESSION SYSTEM
    // ============================================================

    const LEVEL_CONFIG = [
        { level: 1,  xpRequired: 0,    maxBet: 10,  winBonus: 1.0 },
        { level: 2,  xpRequired: 100,  maxBet: 25,  winBonus: 1.1 },
        { level: 3,  xpRequired: 300,  maxBet: 50,  winBonus: 1.2 },
        { level: 4,  xpRequired: 600,  maxBet: 100, winBonus: 1.3 },
        { level: 5,  xpRequired: 1000, maxBet: 200, winBonus: 1.5 },
        { level: 6,  xpRequired: 1500, maxBet: 350, winBonus: 1.7 },
        { level: 7,  xpRequired: 2100, maxBet: 500, winBonus: 2.0 },
        { level: 8,  xpRequired: 2800, maxBet: 750, winBonus: 2.3 },
        { level: 9,  xpRequired: 3600, maxBet: 1000, winBonus: 2.6 },
        { level: 10, xpRequired: 4500, maxBet: 1500, winBonus: 3.0 },
    ];

    // Player state (will be synced with backend later)
    let player = {
        level: 1,
        xp: 0,
        wins: 0,
        losses: 0,
        streak: 0,
        balance: 100.00,
    };

    // ---- Helpers ----
    function getLevelData(level) {
        return LEVEL_CONFIG.find(l => l.level === level) || LEVEL_CONFIG[0];
    }

    function getNextLevelData(level) {
        return LEVEL_CONFIG.find(l => l.level === level + 1);
    }

    function getXPToNext(level) {
        const next = getNextLevelData(level);
        return next ? next.xpRequired : Infinity;
    }

    function getMaxBet(level) {
        return getLevelData(level).maxBet;
    }

    function getWinBonus(level) {
        return getLevelData(level).winBonus;
    }

    // ---- UI Update ----
    function updateLevelUI() {
        const lv = player.level;
        const xp = player.xp;
        const xpToNext = getXPToNext(lv);
        const maxBet = getMaxBet(lv);
        const bonus = getWinBonus(lv);

        document.getElementById('playerLevel').textContent = lv;
        document.getElementById('playerXP').textContent = xp;
        document.getElementById('xpToNext').textContent = xpToNext === Infinity ? 'MAX' : xpToNext;
        document.getElementById('maxBetLimit').textContent = maxBet;
        document.getElementById('winBonus').textContent = bonus;
        document.getElementById('totalWins').textContent = player.wins;

        // XP bar %
        const prevReq = getLevelData(lv).xpRequired;
        let percent = 0;
        if (xpToNext !== Infinity) {
            const xpInLevel = xp - prevReq;
            const xpNeeded = xpToNext - prevReq;
            percent = Math.min((xpInLevel / xpNeeded) * 100, 100);
        } else {
            percent = 100;
        }
        document.getElementById('xpBarFill').style.width = percent + '%';

        // Update bet input max
        const input = document.getElementById('betInput');
        input.max = maxBet;
        const warning = document.getElementById('maxBetWarning');
        if (parseFloat(input.value) > maxBet) {
            warning.classList.add('visible');
        } else {
            warning.classList.remove('visible');
        }

        // Save state to localStorage (temporary)
        try {
            localStorage.setItem('coinflip_player', JSON.stringify(player));
        } catch (_) {}
    }

    // ---- Add XP & Level Up ----
    function addXP(amount) {
        player.xp += amount;
        let leveledUp = false;
        let newLevel = player.level;

        while (true) {
            const next = getNextLevelData(newLevel);
            if (next && player.xp >= next.xpRequired) {
                newLevel = next.level;
                leveledUp = true;
            } else {
                break;
            }
        }

        if (leveledUp) {
            player.level = newLevel;
            showLevelUpNotification(newLevel);
        }

        updateLevelUI();
    }

    // ---- Level Up Notification ----
    function showLevelUpNotification(newLevel) {
        const overlay = document.createElement('div');
        overlay.className = 'level-up-overlay';
        overlay.id = 'levelUpOverlay';

        const maxBet = getMaxBet(newLevel);
        const bonus = getWinBonus(newLevel);

        overlay.innerHTML = `
            <div class="card">
                <span class="emoji">🎉</span>
                <h2>LEVEL ${newLevel}!</h2>
                <p>You've leveled up!</p>
                <p class="new-max">💰 Max Bet: $${maxBet} &nbsp;|&nbsp; Bonus: ${bonus}x</p>
                <button onclick="document.getElementById('levelUpOverlay').remove()">Awesome!</button>
            </div>
        `;

        document.body.appendChild(overlay);
    }

    // ---- Load saved state ----
    function loadPlayerState() {
        try {
            const saved = localStorage.getItem('coinflip_player');
            if (saved) {
                const parsed = JSON.parse(saved);
                player = { ...player, ...parsed };
            }
        } catch (_) {}
        updateLevelUI();
    }

    // ============================================================
    //  GAME LOGIC
    // ============================================================

    let isFlipping = false;

    function flipCoin() {
        if (isFlipping) return;

        const betInput = document.getElementById('betInput');
        let bet = parseFloat(betInput.value);

        // Validate
        if (isNaN(bet) || bet <= 0) {
            alert('Please enter a valid bet amount.');
            return;
        }

        const maxBet = getMaxBet(player.level);
        if (bet > maxBet) {
            alert(`⚠️ Max bet for Level ${player.level} is $${maxBet}`);
            return;
        }

        if (bet > player.balance) {
            alert('❌ Insufficient balance!');
            return;
        }

        // Deduct bet
        player.balance -= bet;
        updateBalanceUI();

        // Flip animation
        isFlipping = true;
        const coin = document.getElementById('coin');
        const resultText = document.getElementById('resultText');
        coin.classList.remove('flipping');
        void coin.offsetWidth; // trigger reflow
        coin.classList.add('flipping');

        // Random result
        const win = Math.random() < 0.5;
        const outcome = win ? 'heads' : 'tails';

        setTimeout(() => {
            coin.textContent = outcome === 'heads' ? 'H' : 'T';
            coin.style.background = outcome === 'heads'
                ? 'radial-gradient(circle at 30% 30%, #f5e56b, #b8860b)'
                : 'radial-gradient(circle at 30% 30%, #c0c0c0, #555)';

            if (win) {
                const bonus = getWinBonus(player.level);
                const winAmount = bet * 2 * bonus;
                player.balance += winAmount;
                resultText.textContent = `🎉 WIN! +$${winAmount.toFixed(2)} (${bonus}x bonus)`;
                resultText.className = 'coin-result win';
                player.wins += 1;
                player.streak = player.streak > 0 ? player.streak + 1 : 1;
                // XP reward: base 10 + bonus based on bet size
                const xpGain = Math.floor(10 + (bet / 10));
                addXP(xpGain);
            } else {
                resultText.textContent = '😢 LOSE! Try again';
                resultText.className = 'coin-result lose';
                player.losses += 1;
                player.streak = player.streak < 0 ? player.streak - 1 : -1;
                // Participation XP
                addXP(2);
            }

            updateBalanceUI();
            updateStatsUI();
            isFlipping = false;
        }, 800);
    }

    // ---- UI Updates ----
    function updateBalanceUI() {
        document.getElementById('balanceDisplay').textContent = '$' + player.balance.toFixed(2);
    }

    function updateStatsUI() {
        document.getElementById('winCount').textContent = player.wins;
        document.getElementById('lossCount').textContent = player.losses;
        document.getElementById('streakCount').textContent = player.streak;
    }

    // ---- Reset coin on new bet ----
    document.getElementById('betInput').addEventListener('input', function() {
        const val = parseFloat(this.value);
        const maxBet = getMaxBet(player.level);
        const warning = document.getElementById('maxBetWarning');
        if (!isNaN(val) && val > maxBet) {
            warning.classList.add('visible');
        } else {
            warning.classList.remove('visible');
        }
    });

    // ---- Preset buttons ----
    document.querySelectorAll('.bet-presets button').forEach(btn => {
        btn.addEventListener('click', function() {
            const amt = parseFloat(this.dataset.amount);
            const input = document.getElementById('betInput');
            const maxBet = getMaxBet(player.level);
            input.value = Math.min(amt, maxBet);
            input.dispatchEvent(new Event('input'));
        });
    });

    // ---- Flip button ----
    document.getElementById('flipBtn').addEventListener('click', flipCoin);

    // ---- Enter key to flip ----
    document.getElementById('betInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') flipCoin();
    });

    // ============================================================
    //  INIT
    // ============================================================

    loadPlayerState();
    updateBalanceUI();
    updateStatsUI();
    updateLevelUI();

    console.log('🪙 CoinFlip Casino loaded!');
    console.log('📊 Current player:', player);
</script>
</body>
</html>
